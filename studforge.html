<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STUDFORGE — génère tes modèles Roblox</title>
<style>
  :root{
    --bg:#0d0d10;
    --panel:#141418;
    --panel-2:#1b1b21;
    --border:#26262e;
    --txt:#f0efec;
    --muted:#8b8b96;
    --accent:#8a79ff;
    --accent-2:#a394ff;
    --ok:#3dd68c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--txt);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    overflow:hidden;
  }
  /* ── la vue 3D occupe tout ── */
  #vue{position:fixed;inset:0;z-index:0}

  /* ── barre du haut ── */
  header{
    position:fixed;top:0;left:0;right:0;z-index:10;
    display:flex;align-items:center;gap:12px;
    padding:14px 18px;
    background:linear-gradient(to bottom,rgba(13,13,16,.92),rgba(13,13,16,0));
  }
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.02em;font-size:17px}
  .logo .brique{
    width:22px;height:22px;border-radius:6px;
    background:linear-gradient(145deg,var(--accent),#6b5bf5);
    position:relative;flex:none;
  }
  /* les petits studs du logo */
  .logo .brique::before,.logo .brique::after{
    content:"";position:absolute;width:6px;height:6px;border-radius:50%;
    background:rgba(255,255,255,.85);top:4px;
  }
  .logo .brique::before{left:4px}
  .logo .brique::after{right:4px}
  .logo b{color:#fff}
  .logo span{color:var(--accent-2);font-weight:800}

  .badge{
    margin-left:auto;font-size:11.5px;color:var(--muted);
    border:1px solid var(--border);border-radius:999px;padding:5px 11px;
    display:flex;align-items:center;gap:6px;
  }
  .point{width:6px;height:6px;border-radius:50%;background:var(--ok)}

  /* ── le panneau de droite : ce qui a été créé ── */
  aside{
    position:fixed;top:58px;right:14px;bottom:104px;width:210px;z-index:10;
    background:rgba(20,20,24,.82);backdrop-filter:blur(14px);
    border:1px solid var(--border);border-radius:18px;
    padding:12px;overflow-y:auto;
  }
  aside h2{
    font-size:11px;text-transform:uppercase;letter-spacing:.09em;
    color:var(--muted);margin-bottom:10px;font-weight:600;
  }
  .carte{
    background:var(--panel-2);border:1px solid var(--border);border-radius:13px;
    padding:9px 11px;margin-bottom:8px;cursor:pointer;transition:.16s;
  }
  .carte:hover{border-color:var(--accent);transform:translateY(-1px)}
  .carte.actif{border-color:var(--accent);background:#1e1b30}
  .carte .nom{font-size:13px;font-weight:600}
  .carte .info{font-size:11px;color:var(--muted);margin-top:3px}
  .vide{font-size:12px;color:var(--muted);line-height:1.5}

  /* ── la barre de saisie en bas ── */
  .barre{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    z-index:10;width:min(680px,calc(100% - 28px));
    display:flex;align-items:center;gap:9px;
    background:rgba(22,22,27,.94);backdrop-filter:blur(16px);
    border:1px solid var(--border);border-radius:999px;
    padding:8px 8px 8px 20px;
    box-shadow:0 18px 50px rgba(0,0,0,.55);
  }
  .barre:focus-within{border-color:var(--accent)}
  input{
    flex:1;background:none;border:none;outline:none;
    color:var(--txt);font-size:15px;font-family:inherit;
  }
  input::placeholder{color:var(--muted)}
  .go{
    display:flex;align-items:center;gap:7px;
    background:linear-gradient(145deg,var(--accent),#6b5bf5);
    color:#fff;border:none;border-radius:999px;
    padding:11px 20px;font-size:14px;font-weight:600;font-family:inherit;
    cursor:pointer;transition:.16s;flex:none;
  }
  .go:hover{filter:brightness(1.12);transform:translateY(-1px)}
  .go:disabled{opacity:.5;cursor:wait;transform:none}

  /* ── les suggestions ── */
  .pistes{
    position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
    z-index:10;display:flex;gap:7px;flex-wrap:wrap;justify-content:center;
    width:min(680px,calc(100% - 28px));
  }
  .piste{
    font-size:12.5px;color:var(--muted);cursor:pointer;
    border:1px solid var(--border);border-radius:999px;padding:6px 13px;
    background:rgba(20,20,24,.7);transition:.15s;
  }
  .piste:hover{color:var(--txt);border-color:var(--accent)}

  /* ── l'état, en haut à gauche sous le logo ── */
  .etat{
    position:fixed;top:64px;left:18px;z-index:10;font-size:12.5px;
    color:var(--muted);display:flex;align-items:center;gap:8px;
  }
  .spin{
    width:13px;height:13px;border-radius:50%;flex:none;
    border:2px solid var(--border);border-top-color:var(--accent);
    animation:tourne .8s linear infinite;
  }
  @keyframes tourne{to{transform:rotate(360deg)}}
  @media (max-width:640px){
    aside{display:none}
    .barre{padding-left:16px}
  }
</style>
</head>
<body>

<div id="vue"></div>

<header>
  <div class="logo">
    <div class="brique"></div>
    <b>STUD</b><span>FORGE</span>
  </div>
  <div class="badge"><span class="point"></span><span id="moteur">prêt</span></div>
</header>

<div class="etat" id="etat" style="display:none">
  <div class="spin"></div><span id="etat-txt">génération…</span>
</div>

<aside>
  <h2>Mes créations</h2>
  <div id="liste"><div class="vide">Rien pour l'instant.<br>Décris un objet et lance-toi.</div></div>
</aside>

<div class="pistes" id="pistes"></div>

<div class="barre">
  <input id="q" placeholder="Décris ton modèle… ex : une épée en studs" autocomplete="off">
  <button class="go" id="go">Générer</button>
</div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

/* ══════════════════════════════════════════════════════════════
   LA VUE 3D
   ══════════════════════════════════════════════════════════════ */
const hote = document.getElementById('vue');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d10);
scene.fog = new THREE.Fog(0x0d0d10, 30, 90);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 500);
camera.position.set(9, 7, 13);

const rendu = new THREE.WebGLRenderer({antialias:true});
rendu.setPixelRatio(Math.min(devicePixelRatio, 2));
rendu.setSize(innerWidth, innerHeight);
rendu.shadowMap.enabled = true;
rendu.shadowMap.type = THREE.PCFSoftShadowMap;
hote.appendChild(rendu.domElement);

const controles = new OrbitControls(camera, rendu.domElement);
controles.enableDamping = true;
controles.dampingFactor = 0.06;
controles.minDistance = 4;
controles.maxDistance = 45;
controles.maxPolarAngle = Math.PI/2 - 0.04;
controles.target.set(0, 2, 0);

// lumières
scene.add(new THREE.HemisphereLight(0xb9c6ff, 0x1a1a20, 1.25));
const soleil = new THREE.DirectionalLight(0xffffff, 2.1);
soleil.position.set(11, 20, 9);
soleil.castShadow = true;
soleil.shadow.mapSize.set(2048, 2048);
soleil.shadow.camera.left = -22; soleil.shadow.camera.right = 22;
soleil.shadow.camera.top = 22;   soleil.shadow.camera.bottom = -22;
scene.add(soleil);
const remplissage = new THREE.DirectionalLight(0x8a79ff, 0.5);
remplissage.position.set(-9, 8, -11);
scene.add(remplissage);

// le sol quadrillé
const sol = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({color:0x15151a, roughness:0.96, metalness:0})
);
sol.rotation.x = -Math.PI/2;
sol.receiveShadow = true;
scene.add(sol);
const grille = new THREE.GridHelper(160, 160, 0x2a2a34, 0x1e1e26);
grille.position.y = 0.01;
scene.add(grille);

// le groupe qui contient le modèle courant
const groupe = new THREE.Group();
scene.add(groupe);

/* ══════════════════════════════════════════════════════════════
   CONSTRUIRE LE MODÈLE À PARTIR DE LA SCÈNE JSON
   ══════════════════════════════════════════════════════════════ */
const MATERIAUX = {
  Plastic:{roughness:.6,metalness:.02},
  SmoothPlastic:{roughness:.35,metalness:.02},
  Metal:{roughness:.3,metalness:.85},
  Wood:{roughness:.9,metalness:0},
  WoodPlanks:{roughness:.85,metalness:0},
  Concrete:{roughness:.95,metalness:0},
  Slate:{roughness:.85,metalness:.05},
  Glass:{roughness:.08,metalness:.1,transparent:true,opacity:.55},
  Neon:{emissive:true},
  Fabric:{roughness:1,metalness:0},
  Grass:{roughness:1,metalness:0},
  Ice:{roughness:.15,metalness:.1,transparent:true,opacity:.75},
  Marble:{roughness:.35,metalness:.1},
};

function materiau(nom, couleurHex){
  const base = MATERIAUX[nom] || MATERIAUX.Plastic;
  const c = new THREE.Color(couleurHex || '#cccccc');
  if (base.emissive){
    return new THREE.MeshStandardMaterial({
      color:c, emissive:c, emissiveIntensity:1.5, roughness:.4, metalness:0});
  }
  return new THREE.MeshStandardMaterial({
    color:c, roughness:base.roughness ?? .6, metalness:base.metalness ?? 0,
    transparent:!!base.transparent, opacity:base.opacity ?? 1});
}

// une texture de studs, dessinée une fois et réutilisée
let TEX_STUDS = null;
function textureStuds(){
  if (TEX_STUDS) return TEX_STUDS;
  const t = document.createElement('canvas');
  t.width = t.height = 128;
  const g = t.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0,0,128,128);
  // 4 plots par face
  for (const [cx,cy] of [[32,32],[96,32],[32,96],[96,96]]){
    const grd = g.createRadialGradient(cx-4,cy-4,2,cx,cy,22);
    grd.addColorStop(0,'#e6e6e6'); grd.addColorStop(1,'#ffffff');
    g.beginPath(); g.arc(cx,cy,20,0,Math.PI*2); g.fillStyle=grd; g.fill();
    g.strokeStyle='rgba(0,0,0,.10)'; g.lineWidth=2; g.stroke();
  }
  TEX_STUDS = new THREE.CanvasTexture(t);
  TEX_STUDS.wrapS = TEX_STUDS.wrapT = THREE.RepeatWrapping;
  return TEX_STUDS;
}

function construit(sceneJSON){
  // on vide
  while (groupe.children.length){
    const o = groupe.children.pop();
    o.geometry?.dispose();
    groupe.remove(o);
  }

  const surface = sceneJSON.surface || 'Smooth';
  const maxY = {v:0};

  for (const p of sceneJSON.parts || []){
    const [x,y,z] = p.pos, [sx,sy,sz] = p.size;
    // en Roblox, Y est vertical ; dans three.js aussi → on garde tel quel
    const geo = new THREE.BoxGeometry(sx, sy, sz);
    const m = materiau(p.material, p.color);
    if (surface === 'Studs' && p.material !== 'Neon'){
      m.map = textureStuds();
      m.map.repeat.set(Math.max(1, Math.round(sx/2)), Math.max(1, Math.round(sz/2)));
      m.needsUpdate = true;
    }
    const mesh = new THREE.Mesh(geo, m);
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    groupe.add(mesh);
    maxY.v = Math.max(maxY.v, y + sy/2);
  }

  // on recadre la caméra sur l'objet
  const boite = new THREE.Box3().setFromObject(groupe);
  const taille = boite.getSize(new THREE.Vector3());
  const centre = boite.getCenter(new THREE.Vector3());
  const rayon = Math.max(taille.x, taille.y, taille.z) * 1.7 + 4;
  camera.position.set(centre.x + rayon, centre.y + rayon*0.75, centre.z + rayon);
  controles.target.copy(centre);
  controles.update();
  return {pieces:(sceneJSON.parts||[]).length, taille, centre};
}

/* ══════════════════════════════════════════════════════════════
   LE MOTEUR
   Tant que le LLM n'est pas entraîné, on utilise un générateur
   local (mêmes règles que le dataset) pour que l'UI vive.
   Le jour où le modèle est prêt, on remplace juste repondre().
   ══════════════════════════════════════════════════════════════ */
const RECETTES = {
  "epee":{nom:"Epee",parts:[
    ["Pommeau",[.5,.5,.3],"Metal","#C9A227"],["Poignee",[.3,.3,1],"Wood","#5B3A1E"],
    ["Garde",[1.7,.28,.28],"Metal","#C9A227"],["Lame",[.36,.16,3.8],"Metal","#E3E7EE"],
    ["Pointe",[.22,.1,.9],"Metal","#E3E7EE"]]},
  "bouclier":{nom:"Bouclier",parts:[
    ["Bouclier",[2.2,.3,2.6],"Metal","#8A9199"],["Bordure",[2.5,.2,2.9],"Metal","#C9A227"],
    ["Embleme",[.7,.1,.7],"Neon","#FFD447"]]},
  "tour":{nom:"Tour",parts:[
    ["Socle",[3.6,3.6,.6],"Concrete","#7C8288"],["Corps",[3,3,6],"Slate","#9AA0A6"],
    ["Porte",[.2,1,2],"WoodPlanks","#A9743B"],["Fenetre",[.2,.8,.8],"Glass","#7FD4FF"],
    ["Toit",[3.6,3.6,.5],"Slate","#8B4A3B"]]},
  "maison":{nom:"Maison",parts:[
    ["Murs",[8,6,3.2],"WoodPlanks","#D9B382"],["Toit",[8.8,6.8,.4],"Slate","#8B4A3B"],
    ["Porte",[.2,1.2,2.2],"Wood","#6B4423"],["Fenetre",[.2,1,1],"Glass","#A8DDF0"]]},
  "arbre":{nom:"Arbre",parts:[
    ["Tronc",[.8,.8,3],"Wood","#6B4423"],["Feuillage",[3.2,3.2,2.6],"Grass","#3E8E41"]]},
  "coffre":{nom:"Coffre",parts:[
    ["Base",[2,1.2,1],"WoodPlanks","#8B5A2B"],["Couvercle",[2,1.2,.4],"WoodPlanks","#A9743B"],
    ["Serrure",[.2,.3,.3],"Metal","#C9A227"]]},
  "robot":{nom:"Robot",parts:[
    ["Tete",[1,1,1],"Metal","#B0B7BE"],["Corps",[1.4,1,1.6],"Metal","#8A9199"],
    ["BrasG",[.4,.4,1.2],"Metal","#8A9199"],["BrasD",[.4,.4,1.2],"Metal","#8A9199"],
    ["Oeil",[.2,.1,.2],"Neon","#FF3B30"]]},
  "potion":{nom:"Potion",parts:[
    ["Flacon",[.8,.8,1.4],"Glass","#C09BE8"],["Bouchon",[.4,.4,.3],"Wood","#6B4423"],
    ["Liquide",[.6,.6,.7],"Neon","#8A79FF"]]},
  "pont":{nom:"Pont",parts:[
    ["Tablier",[10,2.4,.4],"WoodPlanks","#A9743B"],["RambardeG",[10,.2,1],"Wood","#6B4423"],
    ["RambardeD",[10,.2,1],"Wood","#6B4423"],["PilierG",[.8,.8,3],"Concrete","#7C8288"],
    ["PilierD",[.8,.8,3],"Concrete","#7C8288"]]},
  "portail":{nom:"Portail",parts:[
    ["Cadre",[4,.4,4],"Slate","#4A4E54"],["Interieur",[3.4,.2,3.4],"Neon","#8A79FF"]]},
};

const COULEURS = {rouge:"#D0342C",bleu:"#2C6BD0",vert:"#3E8E41",jaune:"#E8C547",
  violet:"#8A79FF",noir:"#22242A",blanc:"#F2F3F5",dore:"#C9A227",argent:"#B0B7BE",
  marron:"#6B4423",orange:"#E8833A",rose:"#E86FA0",turquoise:"#3EC6C6",gris:"#8A9199"};
const TAILLES = {"petit":.55,"miniature":.35,"minuscule":.35,"moyen":1,"normal":1,
  "grand":1.8,"tres grand":2.8,"geant":3.2};

function analyse(phrase){
  const t = phrase.toLowerCase();
  let objet = Object.keys(RECETTES).find(k => t.includes(k));
  if (!objet){
    // quelques synonymes
    if (t.includes("sword") || t.includes("épée")) objet = "epee";
    else if (t.includes("shield")) objet = "bouclier";
    else if (t.includes("tree")) objet = "arbre";
    else if (t.includes("chest")) objet = "coffre";
    else if (t.includes("house")) objet = "maison";
    else if (t.includes("tower")) objet = "tour";
  }
  if (!objet) return null;

  const style = t.includes("studs") ? "Studs"
              : (t.includes("lisse") || t.includes("smooth")) ? "Smooth"
              : t.includes("emboit") ? "Inlet" : "Smooth";

  let facteur = 1;
  for (const [mot,f] of Object.entries(TAILLES)) if (t.includes(mot)) facteur = f;

  let teinte = null;
  for (const [mot,hex] of Object.entries(COULEURS)) if (t.includes(mot)) teinte = hex;

  const r = RECETTES[objet];
  let z = 0; const parts = [];
  for (const [nom,taille,mat,coul] of r.parts){
    const sz = taille.map(v => +(v*facteur).toFixed(2));
    parts.push({name:nom, pos:[0,0,+(z+sz[2]/2).toFixed(2)], size:sz,
                color:teinte || coul, material:mat});
    z += sz[2];
  }
  return {name:r.nom, surface:style, parts};
}

// ── LE point à remplacer quand le LLM sera entraîné ──
async function repondre(phrase){
  // demain : appel au serveur LLM3D → renvoie la scène JSON
  await new Promise(r => setTimeout(r, 420));   // petite pause, ça fait vivant
  return analyse(phrase);
}

/* ══════════════════════════════════════════════════════════════
   L'INTERFACE
   ══════════════════════════════════════════════════════════════ */
const $q = document.getElementById('q');
const $go = document.getElementById('go');
const $liste = document.getElementById('liste');
const $etat = document.getElementById('etat');
const $etatTxt = document.getElementById('etat-txt');

const creations = [];

function dessineListe(){
  if (!creations.length){
    $liste.innerHTML = '<div class="vide">Rien pour l\'instant.<br>Décris un objet et lance-toi.</div>';
    return;
  }
  $liste.innerHTML = creations.map((c,i) => `
    <div class="carte ${c.actif ? 'actif' : ''}" data-i="${i}">
      <div class="nom">${c.objet}</div>
      <div class="info">${c.pieces} pièces · ${c.style}</div>
    </div>`).join('');
  $liste.querySelectorAll('.carte').forEach(el => {
    el.onclick = () => {
      creations.forEach(c => c.actif = false);
      creations[+el.dataset.i].actif = true;
      const c = creations[+el.dataset.i];
      construit(c.scene);
      dessineListe();
    };
  });
}

async function genere(){
  const phrase = $q.value.trim();
  if (!phrase) return;
  $go.disabled = true;
  $etat.style.display = 'flex';
  $etatTxt.textContent = `génération de « ${phrase} »…`;

  try{
    const sc = await repondre(phrase);
    if (!sc){
      $etatTxt.textContent = 'je ne connais pas cet objet — essaie épée, tour, robot…';
      await new Promise(r => setTimeout(r, 1800));
      return;
    }
    const {pieces} = construit(sc);
    creations.forEach(c => c.actif = false);
    creations.unshift({scene:sc, objet:sc.name, pieces,
                       style:sc.surface || 'Smooth', actif:true});
    if (creations.length > 14) creations.pop();
    dessineListe();
  } finally {
    $etat.style.display = 'none';
    $go.disabled = false;
    $q.value = '';
    $q.focus();
  }
}

$go.onclick = genere;
$q.addEventListener('keydown', e => { if (e.key === 'Enter') genere(); });

// les suggestions
const PISTES = ["une épée en studs","une tour en pierre","un robot rouge",
                "un coffre au trésor","une maison en bois","un arbre studs",
                "une potion violette","un grand portail"];
document.getElementById('pistes').innerHTML =
  PISTES.map(p => `<div class="piste">${p}</div>`).join('');
document.querySelectorAll('.piste').forEach(el => {
  el.onclick = () => { $q.value = el.textContent; genere(); };
});

// redimension
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  rendu.setSize(innerWidth, innerHeight);
});

// boucle de rendu
(function boucle(){
  requestAnimationFrame(boucle);
  controles.update();
  rendu.render(scene, camera);
})();

// un premier modèle pour que ce ne soit pas vide
construit(analyse("une épée en studs"));
creations.push({scene:analyse("une épée en studs"), objet:"Epee", pieces:5,
                style:"Studs", actif:true});
dessineListe();
$q.focus();
</script>
</body>
</html>
