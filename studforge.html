<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STUDFORGE — Text to 3D pour Roblox</title>
<style>
  /* ══════════════════════════════════════════════════════════════
     Reproduction fidèle de l'interface Meshy « AI Texturing » :
     liston latéral GAUCHE sombre · viewport à droite sur fond noir
     avec grille de perspective · accent vert olive.
     ══════════════════════════════════════════════════════════════ */
  :root{
    --fond:#131313;          /* le fond général, très sombre */
    --barre:#1a1a1a;         /* la barre du haut */
    --panneau:#171717;       /* la colonne de gauche */
    --bloc:#232323;          /* les zones claires dans le panneau */
    --bloc-2:#2b2b2b;
    --bordure:#303030;
    --bordure-2:#3d3d3d;
    --txt:#ededed;
    --txt-doux:#8a8a8a;
    --txt-faible:#636363;
    --accent:#c3e04a;        /* le vert olive de Meshy */
    --accent-fonce:#b0cc3f;
    --txt-sur-accent:#171717;
    --vue:#0d0d0d;           /* le viewport, encore plus noir */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--fond);color:var(--txt);
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:13.5px;display:flex;flex-direction:column;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ── LA BARRE DU HAUT ── */
  .barre{
    height:46px;flex:none;display:flex;align-items:center;gap:9px;
    padding:0 16px;background:var(--barre);
    border-bottom:1px solid var(--bordure);
  }
  .logo{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;
        letter-spacing:-.02em}
  .logo .sigle{
    width:24px;height:24px;border-radius:6px;flex:none;position:relative;
    background:var(--accent);
  }
  .logo .sigle::before,.logo .sigle::after{
    content:"";position:absolute;width:6px;height:6px;border-radius:1.5px;
    background:#171717;top:5px;
  }
  .logo .sigle::before{left:4px} .logo .sigle::after{right:4px}
  .logo .gr{color:var(--accent)}

  /* ── LE CORPS : panneau gauche + viewport ── */
  .corps{flex:1;display:flex;min-height:0}

  /* ══ COLONNE DE GAUCHE ══ */
  .cote{
    width:302px;flex:none;background:var(--panneau);
    border-right:1px solid var(--bordure);
    display:flex;flex-direction:column;min-height:0;
  }

  .cote-tete{
    display:flex;align-items:center;gap:10px;padding:12px 14px;
    border-bottom:1px solid var(--bordure);
  }
  .retour{
    width:30px;height:30px;border-radius:8px;border:1px solid var(--bordure);
    background:none;color:var(--txt-doux);cursor:pointer;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .retour:hover{color:var(--txt);border-color:var(--bordure-2)}
  .mode{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;
        color:var(--accent);min-width:0}
  .mode svg{width:15px;height:15px;flex:none}
  .mode span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .panneau-ic{
    margin-left:auto;width:30px;height:30px;border-radius:8px;
    border:1px solid var(--bordure);background:none;color:var(--txt-doux);
    cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;
  }
  .panneau-ic:hover{color:var(--txt)}

  .cote-corps{flex:1;overflow-y:auto;padding:16px 14px 12px}
  .cote-corps::-webkit-scrollbar{width:6px}
  .cote-corps::-webkit-scrollbar-thumb{background:var(--bordure-2);border-radius:9px}

  /* le titre du projet */
  .projet{display:flex;align-items:flex-start;gap:8px;margin-bottom:3px}
  .projet h2{font-size:16.5px;font-weight:650;letter-spacing:-.01em;flex:1}
  .points{
    width:26px;height:26px;border-radius:7px;border:none;background:none;
    color:var(--txt-doux);cursor:pointer;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .points:hover{background:var(--bloc);color:var(--txt)}
  .desc{font-size:12.5px;color:var(--txt-faible);margin-bottom:16px}

  /* le bouton de l'historique */
  .historique{
    width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--bloc);border:1px solid var(--bordure);border-radius:9px;
    color:var(--txt);font-size:13px;font-weight:550;font-family:inherit;
    padding:10px;cursor:pointer;margin-bottom:22px;
  }
  .historique:hover{background:var(--bloc-2);border-color:var(--bordure-2)}
  .historique svg{width:15px;height:15px;color:var(--txt-doux)}

  /* les intitulés de section */
  .titre-section{
    font-size:13px;font-weight:600;margin-bottom:9px;color:var(--txt);
  }
  .champ{margin-bottom:20px}

  /* les onglets de mode */
  .onglets{
    display:flex;gap:4px;background:var(--bloc);border:1px solid var(--bordure);
    border-radius:10px;padding:3px;
  }
  .onglet{
    flex:1;border:none;background:none;color:var(--txt-doux);
    font-family:inherit;font-size:13px;font-weight:550;
    padding:8px 10px;border-radius:7px;cursor:pointer;transition:.14s;
  }
  .onglet:hover{color:var(--txt)}
  .onglet.actif{background:var(--accent);color:var(--txt-sur-accent);font-weight:600}

  /* les champs de saisie */
  .zone{
    width:100%;background:var(--bloc);border:1px solid var(--bordure);
    border-radius:10px;color:var(--txt);font-family:inherit;font-size:13.5px;
    padding:11px 13px;outline:none;transition:.14s;resize:none;
  }
  .zone::placeholder{color:var(--txt-faible)}
  .zone:focus{border-color:var(--accent);background:#262626}
  textarea.zone{min-height:104px;line-height:1.55}

  /* le bas du panneau */
  .cote-pied{
    flex:none;padding:11px 14px;border-top:1px solid var(--bordure);
    display:flex;align-items:center;justify-content:space-between;
    font-size:12px;color:var(--txt-faible);
  }
  .credits{display:flex;align-items:center;gap:5px;color:var(--txt-doux);font-weight:550}
  .credits svg{width:12px;height:12px;color:var(--accent)}

  /* ══ LE VIEWPORT ══ */
  .vue{flex:1;position:relative;background:var(--vue);min-width:0}
  #trois{position:absolute;inset:0}

  /* le bouton « générer » flottant, au-dessus du viewport */
  .action{
    position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:3;
    display:flex;align-items:center;gap:9px;
    background:var(--accent);color:var(--txt-sur-accent);border:none;
    border-radius:11px;padding:12px 26px;font-size:14px;font-weight:650;
    font-family:inherit;cursor:pointer;transition:.15s;
    box-shadow:0 10px 34px rgba(195,224,74,.22);
  }
  .action:hover{background:var(--accent-fonce);transform:translateX(-50%) translateY(-1px)}
  .action:disabled{opacity:.5;cursor:progress;transform:translateX(-50%)}
  .action svg{width:16px;height:16px}

  /* les infos en haut du viewport */
  .infos{
    position:absolute;left:16px;top:16px;z-index:3;
    display:flex;gap:7px;
  }
  .puce{
    font-size:11.5px;color:var(--txt-doux);background:rgba(35,35,35,.86);
    border:1px solid var(--bordure);border-radius:999px;padding:5px 11px;
    backdrop-filter:blur(8px);
  }
  .puce b{color:var(--txt);font-weight:600}

  /* les outils, à droite du viewport */
  .outils{
    position:absolute;right:16px;top:16px;z-index:3;display:flex;flex-direction:column;gap:6px;
  }
  .outil{
    width:32px;height:32px;border-radius:8px;border:1px solid var(--bordure);
    background:rgba(35,35,35,.86);color:var(--txt-doux);cursor:pointer;
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);
  }
  .outil:hover{color:var(--txt);border-color:var(--bordure-2)}
  .outil.actif{color:var(--accent);border-color:var(--accent)}
  .outil svg{width:15px;height:15px}

  /* la pellicule des créations, à gauche du viewport */
  .pelli{
    position:absolute;left:16px;top:56px;bottom:80px;width:92px;z-index:3;
    display:flex;flex-direction:column;gap:8px;overflow-y:auto;
  }
  .pelli::-webkit-scrollbar{width:5px}
  .pelli::-webkit-scrollbar-thumb{background:var(--bordure-2);border-radius:9px}
  .vign{
    flex:none;border-radius:10px;overflow:hidden;cursor:pointer;
    border:1.5px solid var(--bordure);background:#1b1b1b;transition:.15s;
  }
  .vign:hover{border-color:var(--bordure-2);transform:translateY(-1px)}
  .vign.actif{border-color:var(--accent)}
  .vign canvas{display:block;width:100%;height:62px}
  .vign .n{font-size:10.5px;padding:5px 7px;white-space:nowrap;
           overflow:hidden;text-overflow:ellipsis;color:var(--txt-doux)}

  /* l'écran d'attente */
  .attente{
    position:absolute;inset:0;z-index:5;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:rgba(13,13,13,.72);backdrop-filter:blur(4px);
  }
  .attente.on{display:flex}
  .rond{
    width:36px;height:36px;border-radius:50%;
    border:3px solid var(--bordure-2);border-top-color:var(--accent);
    animation:t .75s linear infinite;
  }
  @keyframes t{to{transform:rotate(360deg)}}
  .attente p{font-size:13px;color:var(--txt-doux)}

  @media (max-width:820px){
    .cote{width:100%;border-right:none}
    .vue{display:none}
  }
</style>
</head>
<body>

<!-- ══ LA BARRE DU HAUT ══ -->
<header class="barre">
  <div class="logo">
    <div class="sigle"></div>
    STUD<span class="gr">FORGE</span>
  </div>
</header>

<div class="corps">

  <!-- ══ LA COLONNE DE GAUCHE ══ -->
  <aside class="cote">

    <div class="cote-tete">
      <button class="retour" title="Retour">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <div class="mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
          <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/>
          <path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>
        </svg>
        <span>Text to 3D</span>
      </div>
      <button class="panneau-ic" title="Panneau">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9">
          <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>
        </svg>
      </button>
    </div>

    <div class="cote-corps">
      <div class="projet">
        <h2 id="nom-projet">Sans titre</h2>
        <button class="points" title="Plus d'options">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/>
          </svg>
        </button>
      </div>
      <div class="desc" id="desc-projet">Aucune description…</div>

      <button class="historique">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/>
        </svg>
        Historique de génération
      </button>

      <div class="champ">
        <div class="titre-section">Mode de génération</div>
        <div class="onglets" id="onglets">
          <button class="onglet actif" data-v="texte">Text Prompt</button>
          <button class="onglet" data-v="concept">Style guidé</button>
        </div>
      </div>

      <div class="champ">
        <div class="titre-section">Objet</div>
        <input class="zone" id="objet" type="text"
               placeholder="ex. : une épée, un coffre au trésor, une tour" autocomplete="off">
      </div>

      <div class="champ">
        <div class="titre-section">Style</div>
        <textarea class="zone" id="style" maxlength="600"
                  placeholder="Décris le style voulu — ex. : studs, look Roblox classique, couleurs vives, simplifié"></textarea>
      </div>
    </div>

    <div class="cote-pied">
      <span id="compteur">0/600</span>
      <span class="credits">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4.5 13.5H11l-1 8.5L19.5 10H13l0-8z"/></svg>
        illimités
      </span>
    </div>
  </aside>

  <!-- ══ LE VIEWPORT ══ -->
  <div class="vue">
    <div id="trois"></div>

    <div class="infos">
      <span class="puce">Pièces <b id="i-pieces">–</b></span>
      <span class="puce">Style <b id="i-style">–</b></span>
    </div>

    <div class="outils">
      <button class="outil" id="o-cadre" title="Recadrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
        </svg>
      </button>
      <button class="outil actif" id="o-grille" title="Grille">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
          <path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>
        </svg>
      </button>
      <button class="outil" id="o-tourne" title="Rotation auto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
          <path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>
        </svg>
      </button>
    </div>

    <div class="pelli" id="pelli"></div>

    <div class="attente" id="attente">
      <div class="rond"></div>
      <p id="attente-txt">génération…</p>
    </div>

    <button class="action" id="go">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1">
        <path d="M12 3l2.3 6.7L21 12l-6.7 2.3L12 21l-2.3-6.7L3 12l6.7-2.3L12 3z"/>
      </svg>
      Générer
    </button>
  </div>
</div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

/* ══════════════════════════════════════════════════════════
   1. LA VUE 3D — fond noir, grille de perspective
   ══════════════════════════════════════════════════════════ */
const hote = document.getElementById('trois');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d0d);
scene.fog = new THREE.Fog(0x0d0d0d, 55, 190);

const camera = new THREE.PerspectiveCamera(42, 1, .1, 900);
camera.position.set(11, 9, 16);

const rendu = new THREE.WebGLRenderer({antialias:true});
rendu.setPixelRatio(Math.min(devicePixelRatio, 2));
rendu.shadowMap.enabled = true;
rendu.shadowMap.type = THREE.PCFSoftShadowMap;
hote.appendChild(rendu.domElement);

const controles = new OrbitControls(camera, rendu.domElement);
controles.enableDamping = true;
controles.dampingFactor = .07;
controles.minDistance = 3;
controles.maxDistance = 120;
controles.maxPolarAngle = Math.PI/2 - .02;

scene.add(new THREE.HemisphereLight(0xffffff, 0x2a2a30, 1.05));
const cle = new THREE.DirectionalLight(0xffffff, 2.2);
cle.position.set(14, 26, 12);
cle.castShadow = true;
cle.shadow.mapSize.set(2048, 2048);
Object.assign(cle.shadow.camera, {left:-30, right:30, top:30, bottom:-30});
scene.add(cle);
const bord = new THREE.DirectionalLight(0x8a9bd0, .55);
bord.position.set(-13, 10, -15);
scene.add(bord);

// la grille : grandes mailles + fines, comme Meshy
const sol = new THREE.Mesh(
  new THREE.PlaneGeometry(600, 600),
  new THREE.MeshStandardMaterial({color:0x111111, roughness:1, metalness:0}));
sol.rotation.x = -Math.PI/2; sol.receiveShadow = true; scene.add(sol);

const grille = new THREE.GridHelper(400, 400, 0x3a3a3a, 0x232323);
grille.position.y = .004;
scene.add(grille);

const groupe = new THREE.Group();
scene.add(groupe);

/* ══════════════════════════════════════════════════════════
   2. CONSTRUIRE DEPUIS LA SCÈNE JSON
   ══════════════════════════════════════════════════════════ */
const MAT = {
  Plastic:{r:.55,m:.02}, SmoothPlastic:{r:.3,m:.03}, Metal:{r:.26,m:.88},
  Wood:{r:.9,m:0}, WoodPlanks:{r:.85,m:0}, Concrete:{r:.95,m:0},
  Slate:{r:.85,m:.05}, Glass:{r:.06,m:.1,t:1,o:.5}, Neon:{e:1},
  Fabric:{r:1,m:0}, Grass:{r:1,m:0}, Ice:{r:.12,m:.1,t:1,o:.72},
  Marble:{r:.32,m:.1},
};

function materiau(nom, hex){
  const b = MAT[nom] || MAT.Plastic;
  const c = new THREE.Color(hex || '#cccccc');
  if (b.e) return new THREE.MeshStandardMaterial({
    color:c, emissive:c, emissiveIntensity:1.7, roughness:.4, metalness:0});
  return new THREE.MeshStandardMaterial({
    color:c, roughness:b.r ?? .6, metalness:b.m ?? 0,
    transparent:!!b.t, opacity:b.o ?? 1});
}

let TEX = null;
function texStuds(){
  if (TEX) return TEX;
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0,0,128,128);
  for (const [cx,cy] of [[32,32],[96,32],[32,96],[96,96]]){
    const gr = g.createRadialGradient(cx-5,cy-5,2,cx,cy,23);
    gr.addColorStop(0,'#dcdcdc'); gr.addColorStop(1,'#ffffff');
    g.beginPath(); g.arc(cx,cy,19.5,0,Math.PI*2); g.fillStyle = gr; g.fill();
    g.strokeStyle = 'rgba(0,0,0,.14)'; g.lineWidth = 2.4; g.stroke();
  }
  TEX = new THREE.CanvasTexture(cv);
  TEX.wrapS = TEX.wrapT = THREE.RepeatWrapping;
  return TEX;
}

function construit(sj, cadrer = true){
  while (groupe.children.length){
    const o = groupe.children.pop();
    o.geometry?.dispose(); o.material?.dispose?.(); groupe.remove(o);
  }
  const surf = sj.surface || 'Smooth';
  for (const p of sj.parts || []){
    const m = materiau(p.material, p.color);
    if (surf === 'Studs' && p.material !== 'Neon'){
      m.map = texStuds();
      m.map.repeat.set(Math.max(1, Math.round(p.size[0]/2.1)),
                       Math.max(1, Math.round(p.size[2]/2.1)));
      m.needsUpdate = true;
    }
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(...p.size), m);
    mesh.position.set(...p.pos);
    mesh.castShadow = mesh.receiveShadow = true;
    groupe.add(mesh);
  }
  if (cadrer) cadre();
  return (sj.parts || []).length;
}

function cadre(){
  const b = new THREE.Box3().setFromObject(groupe);
  if (!isFinite(b.min.x)) return;
  const t = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
  const r = Math.max(t.x, t.y, t.z) * 1.55 + 6;
  camera.position.set(c.x + r*.72, c.y + r*.66, c.z + r);
  controles.target.copy(c);
  controles.update();
}

/* rendu hors écran, pour les vignettes */
function vignette(canvas, sj){
  const l = canvas.clientWidth || 92, h = canvas.clientHeight || 62;
  canvas.width = l*devicePixelRatio; canvas.height = h*devicePixelRatio;
  const r = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  r.setPixelRatio(devicePixelRatio); r.setSize(l, h, false);
  const s = new THREE.Scene();
  s.add(new THREE.HemisphereLight(0xffffff, 0x404048, 1.6));
  const d = new THREE.DirectionalLight(0xffffff, 2.1); d.position.set(7,13,9); s.add(d);
  const grp = new THREE.Group();
  const surf = sj.surface || 'Smooth';
  for (const p of sj.parts || []){
    const m = materiau(p.material, p.color);
    if (surf === 'Studs' && p.material !== 'Neon'){ m.map = texStuds(); m.needsUpdate = true; }
    const ms = new THREE.Mesh(new THREE.BoxGeometry(...p.size), m);
    ms.position.set(...p.pos); grp.add(ms);
  }
  s.add(grp);
  const b = new THREE.Box3().setFromObject(grp);
  if (!isFinite(b.min.x)) return;
  const t = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
  const rad = Math.max(t.x,t.y,t.z) * 1.3 + 3;
  const cam = new THREE.PerspectiveCamera(40, l/h, .1, 500);
  cam.position.set(c.x + rad*.85, c.y + rad*.72, c.z + rad*.9);
  cam.lookAt(c);
  r.render(s, cam);
}

/* ══════════════════════════════════════════════════════════
   3. LE MOTEUR (règles — à remplacer par le LLM3D)
   ══════════════════════════════════════════════════════════ */
const RECETTES = {
  "epee":{nom:"Epee",parts:[["Pommeau",[.5,.5,.3],"Metal","#C9A227"],["Poignee",[.3,.3,1],"Wood","#5B3A1E"],["Garde",[1.7,.28,.28],"Metal","#C9A227"],["Lame",[.36,.16,3.8],"Metal","#E3E7EE"],["Pointe",[.22,.1,.9],"Metal","#E3E7EE"]]},
  "bouclier":{nom:"Bouclier",parts:[["Bouclier",[2.2,.3,2.6],"Metal","#8A9199"],["Bordure",[2.5,.2,2.9],"Metal","#C9A227"],["Embleme",[.7,.1,.7],"Neon","#FFD447"]]},
  "tour":{nom:"Tour",parts:[["Socle",[3.6,3.6,.6],"Concrete","#7C8288"],["Corps",[3,3,6],"Slate","#9AA0A6"],["Porte",[.2,1,2],"WoodPlanks","#A9743B"],["Fenetre",[.2,.8,.8],"Glass","#7FD4FF"],["Toit",[3.6,3.6,.5],"Slate","#8B4A3B"]]},
  "maison":{nom:"Maison",parts:[["Murs",[8,6,3.2],"WoodPlanks","#D9B382"],["Toit",[8.8,6.8,.4],"Slate","#8B4A3B"],["Porte",[.2,1.2,2.2],"Wood","#6B4423"],["Fenetre",[.2,1,1],"Glass","#A8DDF0"]]},
  "arbre":{nom:"Arbre",parts:[["Tronc",[.8,.8,3],"Wood","#6B4423"],["Feuillage",[3.2,3.2,2.6],"Grass","#3E8E41"]]},
  "coffre":{nom:"Coffre",parts:[["Base",[2,1.2,1],"WoodPlanks","#8B5A2B"],["Couvercle",[2,1.2,.4],"WoodPlanks","#A9743B"],["Serrure",[.2,.3,.3],"Metal","#C9A227"]]},
  "robot":{nom:"Robot",parts:[["Tete",[1,1,1],"Metal","#B0B7BE"],["Corps",[1.4,1,1.6],"Metal","#8A9199"],["BrasG",[.4,.4,1.2],"Metal","#8A9199"],["BrasD",[.4,.4,1.2],"Metal","#8A9199"],["Oeil",[.2,.1,.2],"Neon","#FF3B30"]]},
  "potion":{nom:"Potion",parts:[["Flacon",[.8,.8,1.4],"Glass","#C09BE8"],["Bouchon",[.4,.4,.3],"Wood","#6B4423"],["Liquide",[.6,.6,.7],"Neon","#8A79FF"]]},
  "pont":{nom:"Pont",parts:[["Tablier",[10,2.4,.4],"WoodPlanks","#A9743B"],["RambG",[10,.2,1],"Wood","#6B4423"],["RambD",[10,.2,1],"Wood","#6B4423"],["PilierG",[.8,.8,3],"Concrete","#7C8288"],["PilierD",[.8,.8,3],"Concrete","#7C8288"]]},
  "portail":{nom:"Portail",parts:[["Cadre",[4,.4,4],"Slate","#4A4E54"],["Interieur",[3.4,.2,3.4],"Neon","#8A79FF"]]},
};
const HEX = {rouge:"#D0342C",bleu:"#2C6BD0",vert:"#3E8E41",jaune:"#E8C547",
  violet:"#8A79FF",noir:"#22242A",blanc:"#F2F3F5",dore:"#C9A227",argent:"#B0B7BE",
  marron:"#6B4423",orange:"#E8833A",rose:"#E86FA0",turquoise:"#3EC6C6",gris:"#8A9199"};
const TAILLES = {"petit":.55,"minuscule":.35,"miniature":.35,"moyen":1,"normal":1,
  "grand":1.8,"tres grand":2.8,"geant":3.2};

function analyse(objetTxt, styleTxt){
  const t = (objetTxt + ' ' + styleTxt).toLowerCase();
  let obj = Object.keys(RECETTES).find(k => t.includes(k));
  if (!obj){
    const syn = {epee:["épée","epee","sword"], bouclier:["shield","bouclier"],
      arbre:["tree","arbre"], coffre:["chest","coffre","trésor"], maison:["house","maison"],
      tour:["tower","tour","donjon"], robot:["robot","mecha"], potion:["potion","fiole"],
      pont:["pont","bridge"], portail:["portail","portal"]};
    for (const [k, liste] of Object.entries(syn))
      if (liste.some(m => t.includes(m))){ obj = k; break; }
  }
  if (!obj) return null;
  const r = RECETTES[obj];

  let facteur = 1;
  for (const [m,f] of Object.entries(TAILLES)) if (t.includes(m)) facteur *= f;

  let teinte = null;
  for (const [m,h] of Object.entries(HEX)) if (t.includes(m)){ teinte = h; break; }

  // Meshy demande les 600 premiers caractères ; on garde ça pour le texte
  const surface = /studs|stud|plot|légo|lego|brique/i.test(styleTxt) ? 'Studs'
                : /emboit|inlet|stack/i.test(styleTxt) ? 'Inlet' : 'Studs';

  let z = 0; const parts = [];
  for (const [nom,taille,mat,coul] of r.parts){
    const sz = taille.map(v => +(v*facteur).toFixed(2));
    parts.push({name:nom, pos:[0,0,+(z+sz[2]/2).toFixed(2)], size:sz,
                color:teinte || coul, material:mat});
    z += sz[2];
  }
  return {name:r.nom, surface, parts};
}

async function repondre(objetTxt, styleTxt){
  // ← LE point à brancher sur le LLM3D entraîné
  try{
    const r = await fetch("http://127.0.0.1:8123/genere", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({objet:objetTxt, style:styleTxt}),
      signal:AbortSignal.timeout(6000)});
    if (r.ok) return await r.json();
  }catch(e){ /* pas de serveur : règles locales */ }
  await new Promise(r => setTimeout(r, 420));
  return analyse(objetTxt, styleTxt);
}

/* ══════════════════════════════════════════════════════════
   4. L'INTERFACE
   ══════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const creations = [];
let rotationAuto = false;

function dessinePelli(){
  const p = $('pelli');
  if (!creations.length){ p.innerHTML = ''; return; }
  p.innerHTML = creations.map((c,i) => `
    <div class="vign ${c.actif?'actif':''}" data-i="${i}">
      <canvas data-mini="${i}"></canvas><div class="n">${c.objet}</div>
    </div>`).join('');
  p.querySelectorAll('canvas[data-mini]').forEach(cv => {
    vignette(cv, creations[+cv.dataset.mini].scene);
  });
  p.querySelectorAll('.vign').forEach(el => {
    el.onclick = () => {
      creations.forEach(c => c.actif = false);
      c.actif = true;
      const ch = creations[+el.dataset.i];
      const n = construit(ch.scene);
      $('i-pieces').textContent = n;
      $('i-style').textContent = ch.style;
      $('nom-projet').textContent = ch.objet;
      $('desc-projet').textContent = ch.phrase.length > 62
        ? ch.phrase.slice(0, 62) + '…' : ch.phrase;
      dessinePelli();
    };
  });
}

async function genere(){
  const objet = $('objet').value.trim();
  const style = $('style').value.trim();
  if (!objet && !style){ $('objet').focus(); return; }

  $go.disabled = true;
  $('attente').classList.add('on');
  $('attente-txt').textContent = `génération de « ${objet || style} »…`;

  try{
    const sj = await repondre(objet, style);
    if (!sj){
      $('attente-txt').textContent = 'objet inconnu — essaie épée, tour, robot, coffre…';
      await new Promise(r => setTimeout(r, 2100));
      return;
    }
    creations.forEach(c => c.actif = false);
    const ch = {scene:sj, objet:sj.name, phrase:(objet + ' ' + style).trim(),
                style:sj.surface === 'Studs' ? 'studs'
                     : sj.surface === 'Inlet' ? 'emboîtable' : 'lisse', actif:true};
    creations.unshift(ch);
    if (creations.length > 10) creations.pop();

    const n = construit(sj);
    $('i-pieces').textContent = n;
    $('i-style').textContent = ch.style;
    $('nom-projet').textContent = sj.name;
    $('desc-projet').textContent = ch.phrase.length > 62
      ? ch.phrase.slice(0, 62) + '…' : ch.phrase;
    dessinePelli();
  } finally {
    $('attente').classList.remove('on');
    $go.disabled = false;
  }
}

/* ── les onglets de mode ── */
$('onglets').querySelectorAll('.onglet').forEach(o => {
  o.onclick = () => {
    $('onglets').querySelectorAll('.onglet').forEach(x => x.classList.remove('actif'));
    o.classList.add('actif');
  };
});

/* ── le compteur du champ Style ── */
$('style').addEventListener('input', e => {
  $('compteur').textContent = `${e.target.value.length}/600`;
});

/* ── les outils du viewport ── */
$('o-cadre').onclick = () => cadre();
$('o-grille').onclick = e => {
  grille.visible = !grille.visible;
  e.currentTarget.classList.toggle('actif', grille.visible);
};
$('o-tourne').onclick = e => {
  rotationAuto = !rotationAuto;
  e.currentTarget.classList.toggle('actif', rotationAuto);
};

/* ── la génération ── */
$('go').onclick = genere;
['objet','style'].forEach(id => {
  $(id).addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && id === 'objet'){ e.preventDefault(); genere(); }
  });
});

/* ── redimension ── */
function redim(){
  const l = hote.clientWidth, h = hote.clientHeight;
  if (!l || !h) return;
  camera.aspect = l/h; camera.updateProjectionMatrix();
  rendu.setSize(l, h, false);
}
addEventListener('resize', redim);

/* ── la boucle ── */
(function boucle(){
  requestAnimationFrame(boucle);
  if (rotationAuto) groupe.rotation.y += .006;
  controles.update();
  rendu.render(scene, camera);
})();

/* ── au démarrage : une épée en studs ── */
redim();
const depart = analyse("une épée en studs", "studs");
construit(depart);
$('i-pieces').textContent = depart.parts.length;
$('i-style').textContent = 'studs';
$('nom-projet').textContent = 'Epee';
$('desc-projet').textContent = 'une épée en studs';
creations.push({scene:depart, objet:'Epee', phrase:'une épée en studs',
                style:'studs', actif:true});
dessinePelli();
$('objet').focus();
</script>
